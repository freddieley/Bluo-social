name: Wire avatar creator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire creator
        run: python -c "from pathlib import Path; p=Path('components/BluoApp.tsx'); s=p.read_text(); s=s.replace(\"import { Avatar } from './Avatar';\", \"import { Avatar } from './Avatar';\\nimport { AvatarCreator } from './AvatarCreator';\", 1); s=s.replace(\"{type === 'avatar' && <AvatarEditor config={profile} setConfig={setProfile} close={close} />}\", \"{type === 'avatar' && <AvatarCreator config={profile} setConfig={setProfile} close={close} />}\", 1); p.write_text(s)"
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/BluoApp.tsx
          git commit -m "Use visual avatar creator" || exit 0
          git push
